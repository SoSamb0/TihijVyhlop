name: Проверка игры

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: index.html собран из src/
        run: |
          python src/build.py
          git diff --exit-code index.html || (echo "::error::index.html устарел — запусти python src/build.py и закоммить результат" && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Установка Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Баланс уровней (бот)
        run: npm run balance -- 20
